name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0

jobs:
  release:
    runs-on: windows-latest # Changed from ubuntu-latest to windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for standard-version to work correctly

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json' # Use node version specified in package.json if available, otherwise specify manually
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build # Use the build script from package.json

      - name: Create Release Notes from CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          # Optional: specify the path to your CHANGELOG file if not standard
          # changelog: 'CHANGELOG.md'
          # Get the tag from the trigger event
          tag: ${{ github.ref_name }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, needed to create releases
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }} # Use the generated changelog section as release notes
          draft: false # Set to true if you want to manually publish the release
          prerelease: false # Set to true if this is a pre-release

      - name: Upload Windows Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/BabelTron Setup ${{ github.ref_name }}.exe # Adjust filename based on electron-builder output
          asset_name: BabelTron-Setup-${{ github.ref_name }}.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      # Add similar steps for macOS (.dmg, .zip) and Linux (.AppImage, .deb, .rpm) assets if you build for them
      # Example for macOS zip:
      # - name: Upload macOS Asset (zip)
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ steps.create_release.outputs.upload_url }}
      #     asset_path: ./dist/BabelTron-${{ github.ref_name }}-mac.zip # Adjust filename
      #     asset_name: BabelTron-${{ github.ref_name }}-mac.zip
      #     asset_content_type: application/zip

