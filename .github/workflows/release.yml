name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0

permissions:
  contents: write
  issues: write # Optional, might be needed by changelog action
  pull-requests: write # Optional, might be needed by changelog action

jobs:
  release:
    runs-on: windows-latest # Changed from ubuntu-latest to windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for standard-version to work correctly

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json' # Use node version specified in package.json if available, otherwise specify manually
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build # Use the build script from package.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Get version number
        id: get_version
        # Treat the tag name as a string before calling Substring
        run: echo "VERSION=$(('${{ github.ref_name }}').Substring(1))" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Upload Windows Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          # Use the extracted version number without 'v'
          asset_path: ./dist/BabelTron Setup ${{ steps.get_version.outputs.VERSION }}.exe 
          asset_name: BabelTron-Setup-${{ steps.get_version.outputs.VERSION }}.exe 
          asset_content_type: application/vnd.microsoft.portable-executable

      # Add similar steps for macOS (.dmg, .zip) and Linux (.AppImage, .deb, .rpm) assets if you build for them
      # Example for macOS zip:
      # - name: Upload macOS Asset (zip)
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ steps.create_release.outputs.upload_url }}
      #     asset_path: ./dist/BabelTron-${{ github.ref_name }}-mac.zip # Adjust filename
      #     asset_name: BabelTron-${{ github.ref_name }}-mac.zip
      #     asset_content_type: application/zip

